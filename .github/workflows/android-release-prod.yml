name: Android Release CI

on:
  push:
    branches: [ main ]

jobs:
  release:
    name: Build, sign and publish Release
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
      ANDROID_HOME: ${{ runner.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install Android SDK components
        run: |
          set -e
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y unzip wget >/dev/null
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
        shell: bash

      - name: Prepare keystore (from Secrets)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/keystore.jks
          chmod 600 signing/keystore.jks
          echo "Keystore written to signing/keystore.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Export signing env for Gradle
        run: |
          echo "KEYSTORE_FILE=${{ github.workspace }}/signing/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || '' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || '' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || '' }}" >> $GITHUB_ENV

      - name: Build release (assembleRelease)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode=all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |-
            Automated release generated by GitHub Actions for commit ${{ github.sha }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/*.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
