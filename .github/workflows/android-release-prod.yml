name: Android Release CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --warning-mode=all

      - name: Prepare signing material
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/keystore.jks
          chmod 600 signing/keystore.jks
          test -s signing/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release (assembleRelease)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode=all
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Read app version name
        id: app_version
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 -c "from pathlib import Path; import re; text = Path('app/build.gradle.kts').read_text(); match = re.search(r'versionName\s*=\s*\"([^\"]+)\"', text); print(match.group(1) if match else '')")
          test -n "$VERSION_NAME"
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=NothingElse-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Rename release APK
        run: |
          set -euo pipefail
          mkdir -p release
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "release/${{ steps.app_version.outputs.release_tag }}.apk"
          test -s "release/${{ steps.app_version.outputs.release_tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_version.outputs.release_tag }}
          path: release/${{ steps.app_version.outputs.release_tag }}.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          # Publish this version without deleting or cleaning up older releases.
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          name: NothingElse v${{ steps.app_version.outputs.version_name }}
          body: |-
            Automated release generated by GitHub Actions for commit ${{ github.sha }}.
          files: release/${{ steps.app_version.outputs.release_tag }}.apk
